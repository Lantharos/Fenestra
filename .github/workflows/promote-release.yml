name: Promote soaked Sabine release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Promote the newest eligible release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt,isLatest --jq 'sort_by(.publishedAt) | last')"
          if [[ -z "$release" || "$release" == "null" ]]; then
            exit 0
          fi
          if [[ "$(jq -r '.isLatest' <<<"$release")" == "true" ]]; then
            exit 0
          fi
          tag="$(jq -r '.tagName' <<<"$release")"
          published="$(jq -r '.publishedAt' <<<"$release")"
          published_epoch="$(date -u -d "$published" +%s)"
          now_epoch="$(date -u +%s)"
          if (( now_epoch - published_epoch < 86400 )); then
            echo "$tag is still inside its 24-hour soak period"
            exit 0
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
