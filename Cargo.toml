[workspace]
resolver = "3"
members = [
    "crates/sabine-platform",
    "crates/sabine-runtime",
    "crates/sabine-bridge",
    "crates/sabine-host",
    "crates/sabine",
    "crates/sabine-service",
    "crates/sabine-cli",
    "examples/sabine-notes",
]
default-members = [
    "crates/sabine-platform",
    "crates/sabine-runtime",
    "crates/sabine-bridge",
    "crates/sabine-host",
    "crates/sabine",
    "crates/sabine-service",
    "crates/sabine-cli",
    "examples/sabine-notes",
]

[workspace.package]
version = "0.1.19"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lantharos/Sabine"
homepage = "https://github.com/Lantharos/Sabine"
authors = ["Lantharos"]
keywords = ["sabine", "cef", "webview", "desktop", "chromium"]
categories = ["gui", "rendering"]

[workspace.dependencies]
sabine-runtime = { path = "crates/sabine-runtime", version = "0.1.19" }
sabine-platform = { path = "crates/sabine-platform", version = "0.1.19" }
sabine-bridge = { path = "crates/sabine-bridge", version = "0.1.19" }
sabine-host = { path = "crates/sabine-host", version = "0.1.19" }
sabine = { path = "crates/sabine", version = "0.1.19" }
sabine-service = { path = "crates/sabine-service", version = "0.1.19" }

ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.16"
ctrlc = "3.5.2"
futures-util = "0.3.33"
getrandom = "0.4.3"
glyphon = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
layershellev = "0.19.1"
smithay-client-toolkit = "0.20.0"
ksni = { version = "0.3.6", features = ["blocking"] }
libc = "0.2.189"
pollster = "1.0.1"
clap = { version = "4.6.6", features = ["derive"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
toml = "1.1.4"
toml_edit = "0.25.13"
ureq = "3.4.0"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
url = "2.5.8"
wayland-client = "0.31.15"
wgpu = "30.0.0"
winit = { git = "https://github.com/rust-windowing/winit", rev = "42366231b0d92480a933339bd5eaa7fba8106f42" }
windows = "0.62.2"
x11rb = "0.14.0"

[patch.crates-io]
dpi = { git = "https://github.com/rust-windowing/winit", rev = "42366231b0d92480a933339bd5eaa7fba8106f42" }
winit-common = { git = "https://github.com/rust-windowing/winit", rev = "42366231b0d92480a933339bd5eaa7fba8106f42" }
winit-core = { git = "https://github.com/rust-windowing/winit", rev = "42366231b0d92480a933339bd5eaa7fba8106f42" }
