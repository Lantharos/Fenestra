[package]
name = "sabine-cli"
description = "Sabine CLI: runtime install, app templates, source installs, and bundle staging"
keywords = ["sabine", "cef", "cli", "bundle", "desktop"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "sabine"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
sabine-host.workspace = true
sabine-runtime.workspace = true
sabine-service.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
