[package]
name = "sabine-host"
description = "Sabine CEF host sources and cmake build for the shared Chromium embedder"
keywords = ["sabine", "cef", "chromium", "host", "osr"]
categories = ["development-tools", "gui"]
include = [
    "src/**/*",
    "shared/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
sabine-runtime.workspace = true
sabine-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
